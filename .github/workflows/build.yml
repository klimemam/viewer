name: build

on:
  push:
    branches: [main, native-v0.1]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: viewer-win64
            binpath: stage
          - os: ubuntu-latest
            artifact: viewer-linux-x64
            binpath: viewer.tgz
          - os: macos-latest
            artifact: viewer-macos-arm64
            binpath: viewer.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps (GLFW X11 + Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # python3-numpy: the runner image stopped shipping numpy, and the bench
          # step generates its test data with it
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
                                  wayland-protocols python3-numpy
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Headless render + frame-time check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python3 tools/gen_testdata.py
          # bench at scale: a small image with no ROIs proves nothing
          python3 - <<'PY'
          import numpy as np, pathlib
          d = pathlib.Path('tools/testdata'); d.mkdir(exist_ok=True)
          np.save(d/'bench_big.npy', (np.random.default_rng(0).random((3000,4000))*4095).astype(np.float32))
          np.save(d/'bench_stack.npy', (np.random.default_rng(1).random((120,256,320))*4095).astype(np.float32))
          PY
          # --compare exercises the A/B path too: two images, two textures
          xvfb-run -a ./build/viewer --bench 120 --sequence never --compare wipe \
                   tools/testdata/bench_big.npy tools/testdata/bench_stack.npy 2>&1 | tee bench.log
          grep -q "bench:" bench.log || { echo "no frames rendered"; exit 1; }
          # catastrophic-regression gate only: CI runners use software GL and are
          # noisy, so this is not a micro-benchmark
          med=$(sed -n 's/.*median=\([0-9.]*\)ms.*/\1/p' bench.log)
          echo "median frame time: ${med} ms"
          awk -v m="$med" 'BEGIN { exit (m > 50 ? 1 : 0) }' \
            || { echo "frame time regressed badly (>50 ms)"; exit 1; }

      # viewer-serve gets copied to whatever compute box the user has, and those
      # run old distros: a binary linked against the runner's glibc 2.39 dies
      # there with "GLIBC_2.38 not found" (reproduced on the user's server).
      # Rebuild it - and the plugins MEASURE loads - inside Ubuntu 20.04
      # (glibc 2.31), which covers everything from RHEL 8 up.
      - name: Rebuild viewer-serve for old glibc (Ubuntu 20.04 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:20.04 bash -ec '
            # archive.ubuntu.com is flaky from Actions runners (two runs in a
            # row died on "Connection failed" here); the Azure mirror is what
            # the runner images themselves use, and retries cover the rest
            sed -i "s|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|;s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|" /etc/apt/sources.list
            echo "Acquire::Retries \"5\";" > /etc/apt/apt.conf.d/80-retries
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ >/dev/null
            # miniz.c is C: compiling it as C++ turns its tentative definitions
            # into redefinition errors, so it gets its own gcc pass
            gcc -O2 -DMINIZ_NO_STDIO -c build/_deps/miniz-src/miniz.c -o /tmp/miniz.o
            g++ -O2 -std=c++17 -DMINIZ_NO_STDIO -Icore -Iinclude -Ibuild/_deps/miniz-src \
                core/serve_main.cpp core/serve.cpp core/plugin_host.cpp /tmp/miniz.o \
                -o build/viewer-serve \
                -static-libgcc -static-libstdc++ -ldl -lpthread -lstdc++fs
            for f in plugins/*.c; do
              gcc -O2 -shared -fPIC -Iinclude "$f" \
                  -o "build/plugins/$(basename "${f%.c}").so" -lm
            done'
          ./build/viewer-serve --help
          echo "glibc ceiling of the compat binary:"
          objdump -T build/viewer-serve | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      - name: Package (Windows exe + plugins)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item build/Release/viewer.exe stage/
          Copy-Item build/Release/viewer-serve.exe stage/
          Copy-Item -Recurse build/plugins stage/plugins
      # viewer-serve is what you copy to a compute server: it links no GL and no
      # X11, so it starts on a headless box where the GUI binary would not load.
      - name: Package (preserve executable bit)
        if: runner.os != 'Windows'
        run: tar -czf viewer.tgz -C build viewer viewer-serve plugins
      # upload-artifact v6 / download-artifact v7 are the Node 24-native pairs
      # (the major numbers differ by one across the two actions); v5 of each
      # still declared node20 and warned on every run.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binpath }}

  # A machine with no build tools stays current with nothing but git:
  #     git clone -b binaries --single-branch <repo> viewer-bin
  #     cd viewer-bin && git pull        # done: viewer.exe is the latest main
  # The branch holds ONLY the built binaries (orphan history, force-pushed), so
  # pulls are small and the source history never carries exe blobs.
  publish-binaries:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Assemble the binaries branch
        run: |
          mkdir -p out/win64 out/linux-x64 out/macos-arm64
          cp -r dist/viewer-win64/* out/win64/
          tar xzf dist/viewer-linux-x64/viewer.tgz -C out/linux-x64
          tar xzf dist/viewer-macos-arm64/viewer.tgz -C out/macos-arm64
          echo "built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/VERSION.txt
          # The branch history is REPLACED on every publish (so the repo never
          # accumulates old exe blobs) - which means a plain `git pull` refuses
          # with "divergent histories". Ship the correct update command as a
          # script so nobody has to know that.
          cat > out/update.cmd <<'EOF'
          @echo off
          git fetch origin binaries && git reset --hard origin/binaries
          EOF
          cat > out/update.sh <<'EOF'
          #!/bin/sh
          git fetch origin binaries && git reset --hard origin/binaries
          EOF
          chmod +x out/update.sh
          cat > out/README.md <<'EOF'
          # Prebuilt binaries (branch: binaries)

          Updated automatically from every push to main. To stay current on a
          machine with no build environment:

              git clone -b binaries --single-branch <this repo> viewer-bin

          and from then on just run `update.cmd` (Windows) / `./update.sh`.
          (Plain `git pull` will NOT work: this branch's history is replaced on
          every publish so the repository never grows with old binaries.)

          - win64/viewer.exe            - the GUI (Windows)
          - win64/viewer-serve.exe      - the headless peer (Windows)
          - win64/plugins/              - analyzers (keep next to the exe)
          - linux-x64/viewer            - the GUI (Linux)
          - linux-x64/viewer-serve      - the headless peer for a compute server
          - macos-arm64/                - the same pair for macOS

          See docs/startup.md on main for how ssh:// viewing fits together.
          EOF
      - name: Force-push as the binaries branch
        run: |
          cd out
          git init -b binaries
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "binaries for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
