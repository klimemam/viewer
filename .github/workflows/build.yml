name: build

on:
  # Every branch, not just main. A pull_request run builds refs/pull/N/merge,
  # which GitHub cannot produce once the PR CONFLICTS with main - so the
  # workflow does not start at all: no run, no red X, nothing to notice. That
  # is worse than a failure, because a failure is visible, and it read as
  # "still queued" for an hour before anyone checked `gh pr view --json
  # mergeable`. A push-triggered run builds the branch as it stands, which
  # conflicts cannot stop, so a branch always has a verdict of its own.
  push:
    branches: ['**']
    # Documentation does not compile. A board commit, a design doc or a
    # handoff file used to cost three OS builds x two runs, and the wait was
    # long enough to change how often anyone dared to commit docs (measured:
    # ~20 min per push, 2026-08-17). What CANNOT go in this list: .github
    # (the workflow must test its own changes), tools/ and media/ (tests read
    # them), and any path a selftest walks.
    paths-ignore:
      - 'docs/**'
      - 'handoff/**'
      - '*.md'
  # ...and the merge result stays gated separately: a branch that is green on
  # its own can still break main, which is the thing this was always for.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'handoff/**'
      - '*.md'
  workflow_dispatch:

# A superseded run answers a question nobody is asking anymore: on branches,
# a new push cancels the run for the old tip. main keeps every run - its
# history is the record "this exact commit was green", and a cancelled run
# there would leave a merge with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: viewer-win64
            binpath: stage
          - os: ubuntu-latest
            artifact: viewer-linux-x64
            binpath: viewer.tgz
          - os: macos-latest
            artifact: viewer-macos-arm64
            binpath: viewer.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # One Python on all three runners, so the fixtures are generated by the
      # same interpreter everywhere. (The runner images' own python3 varies, and
      # on Windows the bare "python3" on PATH is a Microsoft Store stub.)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy (tools/gen_testdata.py writes every fixture)
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy
      - name: Install Linux deps (GLFW X11 + Wayland, xvfb for the selftests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # xvfb + libgl1-mesa-dri: five of the 34 selftests create a real GLFW
          # window and a GL context, so a headless runner needs a display and a
          # software GL driver to run those five - and this is the only runner
          # in the matrix where they can run at all. (The bench step needs them
          # too and used to install them itself, halfway down the job.)
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
                                  wayland-protocols xvfb libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release

      # Every --*-selftest flag, on every OS in the matrix. The list lives in
      # CMakeLists.txt; this script builds, regenerates tools/testdata and runs
      # ctest, printing one line per selftest and the full output of any that
      # fail. Same command a developer runs locally - that is the point of it.
      # It comes BEFORE packaging so a failed assert cannot ship a binary.
      #
      # The script probes for an OpenGL context first and reports what it found.
      # Only the Linux runner has one (xvfb + libgl1-mesa-dri, installed above),
      # and it runs all 34. On Windows and macOS the hosted runners have no GL,
      # so the 29 that take the --no-window startup path run and gate there,
      # and the five that draw real ImGui frames are skipped BY NAME with GLFW's
      # own reason printed. Read the "ran N, skipped M" line: it is 34/0 on
      # Linux and 29/5 on the other two, and a run that selects nothing at all
      # is a failure rather than a very fast pass. Those figures are a comment
      # and the line is the measurement - this block said 28/0 and 22/6 for
      # long enough that the two disagreed by six without anyone noticing.
      #
      # Nothing here lists any test. Which set a test belongs to is the word
      # NOGL on its viewer_selftest() line, and the script asks ctest for the
      # labels - so a test that gains or loses a window moves between the two
      # counts above with no edit to this file.
      - name: Selftests
        shell: bash
        env:
          # Linux is KNOWN to have a context here, so its absence would be a
          # regression in THIS job rather than a fact about the machine: fail,
          # do not skip. This is a statement about the runner we provisioned -
          # what actually RUNS is still decided by the probe, on every OS, so
          # Windows and macOS begin gating fully the day they gain a context.
          VIEWER_SELFTEST_REQUIRE_GL: ${{ runner.os == 'Linux' && '1' || '' }}
        run: tools/run_selftests.sh build
      # The step above is a gate, so when it fails the job stops - and until now
      # that took the evidence with it. run_selftests.sh files each failing
      # test's own output under docs/diagnostics/auto/, but that is a directory
      # on a hosted runner, deleted a minute or two later along with everything
      # else. The assertion text then existed only inside this job's log, which
      # is why three intermittent failures were investigated by re-running and
      # hoping. `if: failure()` is the whole point of the step: it runs BECAUSE
      # the selftests failed, and turns the one artifact worth having into
      # something downloadable for as long as the run is kept.
      - name: Keep the failing selftests' output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: selftest-failure-${{ matrix.artifact }}
          path: docs/diagnostics/auto/
          if-no-files-found: ignore
          retention-days: 30
      - name: Adapter suite
        # 36 cases over viewer_import.py and run_adapter.py that nothing ran.
        # They were written against docs/features/adapters/input-adapters.md section 4 and are the
        # only check on what a user's reader is allowed to return - and they had
        # never gated a merge, so a change that broke them would have landed
        # green. numpy is already installed for gen_testdata.py, so this costs a
        # step and no setup. Every OS: the harness spawns a child process and
        # writes files, and that is exactly where platforms differ.
        run: python tools/import/test_adapters.py
      - name: Headless render + frame-time check
        if: runner.os == 'Linux'
        run: |
          # xvfb and the software GL driver are installed with the other Linux
          # deps now, because the selftest step above needs them too.
          # --bench adds the two large arrays this gate uses (bench at scale: a
          # small image with no ROIs proves nothing). They live in
          # gen_testdata.py rather than in a heredoc here, so the fixtures have
          # exactly one source.
          python tools/gen_testdata.py --bench
          # --compare exercises the A/B path too: two images, two textures
          xvfb-run -a ./build/viewer --bench 120 --stack never --compare wipe \
                   tools/testdata/bench_big.npy tools/testdata/bench_stack.npy 2>&1 | tee bench.log
          # "^bench: frames=", not "bench:" - the run prints several bench:
          # lines now, and the one that means FRAMES WERE RENDERED is the stats
          # line. A prefix that any of them satisfies is a check that a run
          # rendering nothing can pass.
          grep -q "^bench: frames=" bench.log || { echo "no frames rendered"; exit 1; }
          # ...and that the frames rendered contain what the number claims. The
          # run prints the panels its measured frames drew and exits non-zero
          # when a panel it OPENED never did (an unselected dock tab draws
          # nothing, which is how this gate spent every run from ba40ba8 until
          # the default layout was fixed watching a fifth of the work). The pipe
          # into tee above swallows that exit status, so the verdict is read
          # from the log instead of relied on: a gate that quotes a frame time
          # has to check that time's scope.
          grep -q "^benchcov: .* PASS$" bench.log \
            || { echo "the bench measured fewer panels than it opened:"; \
                 grep -E "^bench: (panels|OPEN)|^benchcov:" bench.log; exit 1; }
          # catastrophic-regression gate only: CI runners use software GL and are
          # noisy, so this is not a micro-benchmark
          med=$(sed -n 's/.*median=\([0-9.]*\)ms.*/\1/p' bench.log)
          echo "median frame time: ${med} ms"
          awk -v m="$med" 'BEGIN { exit (m > 50 ? 1 : 0) }' \
            || { echo "frame time regressed badly (>50 ms)"; exit 1; }

      # EVERYTHING THIS JOB SHIPS FOR LINUX IS BUILT HERE, not on the runner.
      # ubuntu-latest is 24.04 (glibc 2.39), and a binary linked there demands
      # that glibc from whatever machine it lands on: "GLIBC_2.38 not found" on
      # Ubuntu 22.04, on Debian 12, on RHEL 9. viewer-serve has been rebuilt in
      # an Ubuntu 20.04 container (glibc 2.31) since PR #159 for exactly that
      # reason - and issue #241 is what the other half of that asymmetry cost:
      # the PEER started on the user's old compute box and the VIEWER that
      # talks to it did not, because only the peer was ever rebuilt. The
      # container now builds the whole tarball: viewer, viewer-serve, plugins.
      #
      # WHY CMAKE AND NOT A g++ LINE. This step used to hand-write the peer's
      # compile - a list of core/*.cpp kept in step with CMakeLists.txt by hand.
      # That is affordable for a binary of twelve translation units and is not
      # affordable for the viewer, which is imgui, GLFW, LibRaw and the whole
      # spine besides. The project's own build system is the only thing that
      # knows what `viewer` is made of, so the container runs THAT, and the
      # source list exists exactly once again instead of twice.
      #
      # THE CONTAINER MUST FINISH THE LINK, and the way this went wrong once is
      # worth keeping: the predecessor of this step was one single-quoted
      # argument to `bash -ec '...'`, and an apostrophe in an English comment -
      # "the peer's PNG readers" - CLOSED that quote. Everything after it was
      # parsed by the RUNNER's shell instead: the container compiled miniz.o and
      # exited, and the runner ran the rest, so the "compat" binary was being
      # linked against the runner's own glibc. NOTHING SWALLOWED AN ERROR -
      # `bash -ec` had -e all along; the script had been cut in half by a quote,
      # and each half stopped on its first failure exactly as told. A heredoc
      # quoted with <<'COMPAT' has no such character: neither shell parses
      # anything inside it, so prose in these comments cannot reach out and
      # change what runs. `set -euo pipefail` is written out at the top for the
      # same reason. And the ceiling is ASSERTED below rather than printed,
      # which is the half that would have caught it either way.
      #
      # 2.31 IS THE FLOOR THIS REACHES: Debian 11 and Ubuntu 20.04 (both 2.31),
      # RHEL 9 (2.34), and everything above them. NOT RHEL 8, which ships 2.28 -
      # the container's own libm already forces 2.29 on the peer (exp, log and
      # pow gained a version there), so that was never within reach.
      #
      # IT COSTS A SECOND FULL BUILD of this tree, in series with the first. The
      # first one is not redundant: it is the one the 34 selftests and the bench
      # gate ran against, on the OS this project is developed on, and it stays
      # for that. This one is the one that ships.
      - name: Rebuild what ships for old glibc (Ubuntu 20.04 container)
        if: runner.os == 'Linux'
        run: |
          # The compat build uses THE SAME SOURCES the cmake build above
          # fetched: CMakeLists.txt pins every version, FetchContent unpacked
          # them under build/_deps, and the container is pointed at that tree
          # through the standard FETCHCONTENT_SOURCE_DIR_* overrides the
          # dependency blocks in CMakeLists.txt document. One pin, every
          # platform - a peer that decoded .exr with a different OpenEXR than
          # the client is #148's two-answers defect one level down - and no
          # second download from inside the container, which is one fewer
          # network dependency in a step that already has apt and a tarball.
          # If a runner image ever ships one of these as a system package,
          # find_package() wins upstairs and the directory never appears; fail
          # HERE rather than let the container quietly fetch a copy of its own.
          for d in glfw imgui miniz pfd imath openexr libraw; do
            test -d "build/_deps/$d-src" \
              || { echo "build/_deps/$d-src is missing: the cmake build above did not fetch $d (a system copy satisfied find_package?), so this step cannot build what the runner build used"; exit 1; }
          done
          docker run --rm -i -v "$PWD:/src" -w /src ubuntu:20.04 bash -s <<'COMPAT'
          set -euo pipefail
          # archive.ubuntu.com is flaky from Actions runners (two runs in a
          # row died on "Connection failed" here); the Azure mirror is what
          # the runner images themselves use, and retries cover the rest
          sed -i "s|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|;s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|" /etc/apt/sources.list
          echo "Acquire::Retries \"5\";" > /etc/apt/apt.conf.d/80-retries
          apt-get update -qq >/dev/null
          # The GUI half is the whole difference from the peer-only step this
          # replaced. GLFW opens libX11, libwayland-client and libxkbcommon
          # with dlopen at RUN time, so what it needs here is their HEADERS and
          # neither display server becomes a hard dependency of the binary;
          # libX11 itself is linked because core/window_frame.cpp calls
          # XSendEvent directly, and libGL because find_package(OpenGL) is
          # REQUIRED. wayland-scanner (libwayland-bin) generates GLFW's
          # protocol code from XML that GLFW VENDORS in deps/wayland, so
          # 20.04's own wayland-protocols version does not enter into it.
          # git is for cmake/gitversion.cmake: without it in here, every
          # shipped Linux binary would name its commit "unknown".
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              g++ make git curl ca-certificates \
              xorg-dev libgl1-mesa-dev libwayland-dev libwayland-bin \
              libxkbcommon-dev >/dev/null
          # 20.04 ships cmake 3.16.3 and this project's cmake_minimum_required
          # is 3.21, so the container brings its own. Kitware's linux-x86_64
          # tarball is built against glibc 2.17, which is the only reason it can
          # run in here at all. PINNED: `latest` would let a cmake release
          # change what this step produces on a day nobody touched the repo.
          curl -fsSL --retry 5 --retry-delay 5 \
               https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar xz -C /opt
          export PATH=/opt/cmake-3.31.6-linux-x86_64/bin:$PATH
          # git 2.25 has no dubious-ownership check, so this is insurance for
          # the day the base image moves: the checkout belongs to the runner's
          # uid and everything in this container is root.
          git config --global --add safe.directory /src
          # -static-libstdc++ -static-libgcc: the user's report in #241 carried
          # "GLIBCXX_3.4.32 not found" beside the two glibc lines, and that one
          # the old container does NOT fix by itself - libstdc++.so.6 is
          # resolved on the target machine, so a 20.04 build still asks it for
          # whatever symbols it used. Linking both compiler runtimes IN removes
          # the question; the NEEDED assertion below is what keeps them out.
          #
          # -lstdc++fs: gcc 9 keeps std::filesystem in an archive of its own,
          # and this tree uses it in both binaries. It goes in
          # STANDARD_LIBRARIES rather than in a linker flag because it has to
          # come AFTER the objects that need it - CMAKE_EXE_LINKER_FLAGS is
          # emitted before them, where an archive resolves nothing.
          #
          # NOT CACHED, deliberately, and the reason has not changed since this
          # step only built OpenEXR: a correct key would have to name the
          # container's compiler as well as every pinned version, and
          # `ubuntu:20.04` is a MOVING tag, so no key available here can promise
          # the cached objects were built by the g++ that is about to link them.
          cmake -S /src -B /tmp/compat -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
                -DCMAKE_MODULE_LINKER_FLAGS="-static-libgcc" \
                -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc" \
                -DCMAKE_CXX_STANDARD_LIBRARIES="-lstdc++fs" \
                -DFETCHCONTENT_SOURCE_DIR_GLFW=/src/build/_deps/glfw-src \
                -DFETCHCONTENT_SOURCE_DIR_IMGUI=/src/build/_deps/imgui-src \
                -DFETCHCONTENT_SOURCE_DIR_MINIZ=/src/build/_deps/miniz-src \
                -DFETCHCONTENT_SOURCE_DIR_PFD=/src/build/_deps/pfd-src \
                -DFETCHCONTENT_SOURCE_DIR_IMATH=/src/build/_deps/imath-src \
                -DFETCHCONTENT_SOURCE_DIR_OPENEXR=/src/build/_deps/openexr-src \
                -DFETCHCONTENT_SOURCE_DIR_LIBRAW=/src/build/_deps/libraw-src \
                >/dev/null
          # OUT OF THE SOURCE TREE (/tmp/compat, not /src/build-compat): a build
          # directory inside the checkout would be an untracked directory, and
          # cmake/gitversion.cmake asks `git status --porcelain` whether the tree
          # is clean - so the binary would stamp itself "<hash>+local" and stop
          # naming the commit it was built from, which is the one thing that
          # string is for.
          #
          # The plugin list is the .c files, exactly as the step this replaced
          # globbed them: one source, one MODULE, target name is the basename.
          # Nothing here repeats CMakeLists.txt's list of them. Naming targets
          # rather than building `all` also keeps the .exr fixture tool out of
          # this build - it writes into the source tree, and these fixtures were
          # already written by the runner build the selftests ran against.
          targets="viewer viewer-serve"
          for f in plugins/*.c; do targets="$targets $(basename "${f%.c}")"; done
          cmake --build /tmp/compat -j"$(nproc)" --target $targets
          # Over the runner's own, in place: from here down build/viewer,
          # build/viewer-serve and build/plugins ARE the compat binaries, so
          # every check below and the tarball itself are about the thing that
          # actually ships. The runner build has already done its job upstairs.
          install -m755 /tmp/compat/viewer /tmp/compat/viewer-serve /src/build/
          install -m755 /tmp/compat/plugins/*.so /src/build/plugins/
          COMPAT
          # THE CEILING IS ASSERTED, not printed for someone to notice. This is
          # the whole promise of the step - it is what "runs on an old distro"
          # MEANS - and a printed number is not a gate: the quote bug described
          # above shipped a runner-built binary past this very line for as long
          # as it linked. ONE number for every shipped binary, and it is the
          # PROMISE (the container's own glibc) rather than each binary's
          # measured ceiling: inside a 2.31 container nothing can exceed 2.31
          # anyway, so per-binary numbers would only drift apart and be updated
          # for no reader's benefit. What this actually catches is a link that
          # escaped the container - the runner's 24.04 puts GLIBC_2.34+ symbols
          # in anything it touches.
          #
          # The NEEDED list is the second half, and it is #241's other error
          # line: a binary that still names libstdc++.so.6 or libgcc_s.so.1 will
          # die with "GLIBCXX_3.4.32 not found" on a machine whose libstdc++ is
          # older, however old the glibc it was built against.
          max=GLIBC_2.31
          fail=0
          for f in build/viewer build/viewer-serve build/plugins/*.so; do
            need="$(objdump -p "$f" | sed -n 's/^ *NEEDED *//p' | tr '\n' ' ')"
            ceil="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
            echo "$f: needs at most ${ceil:-<none>}  [ ${need}]"
            case " $need " in
              *" libstdc++.so.6 "*|*" libgcc_s.so.1 "*)
                echo "  ^ links a compiler runtime dynamically: -static-libstdc++ / -static-libgcc did not take"
                fail=1 ;;
            esac
            if [ -z "$ceil" ]; then
              echo "  ^ no versioned glibc symbols at all: objdump found nothing to check"
              fail=1
            elif [ "$(printf '%s\n%s\n' "$ceil" "$max" | sort -V | tail -1)" != "$max" ]; then
              echo "  ^ needs $ceil, above the $max this step promises"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # ...and what ships is MEASURED, not assumed. BOTH ends of this are the
      # container's build now, so this is also the first time the compat viewer
      # is asked to run at all - which is the whole of #241, and a thing no
      # objdump can answer.
      #
      # --media-selftest opens a .exr, a .tif, a .dng, a .y4m and a .png with
      # this binary's own readers: it is what says OpenEXR, LibRaw and stb
      # survived being compiled by a five-year-older compiler, rather than only
      # that they linked. --fmtgate-selftest is the same gate the selftest step
      # ran upstairs, pointed at the pair that ships: one file opened locally
      # and the same file served over this peer, pixels compared bit for bit
      # (P1/P2). The .exr row is the reason it exists - the client builds
      # OpenEXR normally, and a peer that refused the file the client opened is
      # #148's defect - so "it linked" is not the check. A serve is.
      - name: The compat binaries read, and serve, what they ship for
        if: runner.os == 'Linux'
        run: |
          ./build/viewer --no-window --media-selftest tools/testdata/media
          ./build/viewer --no-window --fmtgate-selftest tools/testdata/media \
                         --remote-exe "$PWD/build/viewer-serve"

      - name: Package (Windows exe + plugins)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item build/Release/viewer.exe stage/
          Copy-Item build/Release/viewer-serve.exe stage/
          Copy-Item -Recurse build/plugins stage/plugins
          # The attribution the bundled libraries require travels WITH the
          # binaries: the binaries branch is the distribution, and a notice
          # file that only exists in the source tree has not been given to
          # anybody who received a build. (LICENSE joins it here once the
          # project has one - that choice is the owner's to make.)
          Copy-Item THIRD-PARTY-NOTICES.md stage/
          # desktop shortcut installer, and the icons it points at (the green
          # viewer-remote.ico is what a connect-to-a-server shortcut gets)
          Copy-Item tools/install_shortcut.cmd stage/
          Copy-Item tools/install_shortcut.ps1 stage/
          Copy-Item build/icons/viewer.ico stage/
          Copy-Item build/icons/viewer.png stage/
          Copy-Item build/icons/viewer-remote.ico stage/
          Copy-Item build/icons/viewer-remote.png stage/
          # The reader harness. runAdapterScript() looks for tools/import/
          # run_adapter.py beside the exe (and up to three levels above it), so
          # without this the whole reader feature is dead in a packaged build:
          # no shipped readers listed, nothing runnable, and "New reader..."
          # fails because the template it copies is not there either.
          New-Item -ItemType Directory stage/tools/import | Out-Null
          Copy-Item tools/import/run_adapter.py   stage/tools/import/
          Copy-Item tools/import/viewer_import.py stage/tools/import/
          Copy-Item -Recurse tools/import/adapters stage/tools/import/adapters
          Remove-Item -Recurse -Force stage/tools/import/adapters/__pycache__ -ErrorAction SilentlyContinue
      # viewer-serve is what you copy to a compute server: it links no GL and no
      # X11, so it starts on a headless box where the GUI binary would not load.
      - name: Package (preserve executable bit)
        if: runner.os != 'Windows'
        run: |
          # install_shortcut.sh writes the .desktop entry / .app bundle and wants
          # icons/viewer.png next to it, so both travel with the binaries
          cp tools/install_shortcut.sh build/
          # ...and the third-party attribution, for the reason in the Windows step
          cp THIRD-PARTY-NOTICES.md build/
          # the reader harness travels with the binary - see the Windows step
          mkdir -p build/tools/import
          cp tools/import/run_adapter.py tools/import/viewer_import.py build/tools/import/
          cp -r tools/import/adapters build/tools/import/adapters
          rm -rf build/tools/import/adapters/__pycache__
          tar -czf viewer.tgz -C build viewer viewer-serve plugins icons install_shortcut.sh tools THIRD-PARTY-NOTICES.md
      # upload-artifact v6 / download-artifact v7 are the Node 24-native pairs
      # (the major numbers differ by one across the two actions); v5 of each
      # still declared node20 and warned on every run.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binpath }}

  # A machine with no build tools stays current with nothing but git:
  #     git clone -b binaries --single-branch <repo> viewer-bin
  #     cd viewer-bin && git pull        # done: viewer.exe is the latest main
  # The branch holds ONLY the built binaries (orphan history, force-pushed), so
  # pulls are small and the source history never carries exe blobs.
  publish-binaries:
    needs: build
    # One publish at a time, queued not cancelled. Two quick pushes to main run
    # this job concurrently, both force-push the binaries ref, and the loser
    # dies with "cannot lock ref" - which reads as a red CI on a commit whose
    # build was fine. Queueing serializes them; the last one to run publishes
    # the newest build, which is the outcome the race was fighting over anyway.
    concurrency:
      group: publish-binaries
      cancel-in-progress: false
    # main publishes to `binaries`; any other branch publishes to
    # `binaries-<branch>`. The second one exists because the machine that most
    # needs a build is the one with no build environment - and often no GitHub
    # CLI and no token either. `git fetch` is the only tool it is guaranteed to
    # have, so a branch is the only delivery it can actually receive.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Assemble the binaries branch
        run: |
          mkdir -p out/win64 out/linux-x64 out/macos-arm64
          cp -r dist/viewer-win64/* out/win64/
          tar xzf dist/viewer-linux-x64/viewer.tgz -C out/linux-x64
          tar xzf dist/viewer-macos-arm64/viewer.tgz -C out/macos-arm64
          echo "built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/VERSION.txt
          # The branch history is REPLACED on every publish (so the repo never
          # accumulates old exe blobs) - which means a plain `git pull` refuses
          # with "divergent histories". Ship the correct update command as a
          # script so nobody has to know that.
          #
          # These are COPIED from tools/binaries/, not written here. They used to
          # be heredocs in this file, and that quietly made the published branch
          # the wrong place to edit them: anything committed there was destroyed
          # by the next publish, which force-pushes over it. A script nobody can
          # edit where it lives, and cannot run without a CI round trip, is a
          # script nobody tests.
          cp tools/binaries/update.cmd tools/binaries/update.sh tools/binaries/README.md out/
          cp tools/binaries/.gitignore out/ 2>/dev/null || true
          chmod +x out/update.sh
      - name: Force-push as the binaries branch
        run: |
          cd out
          git init -b binaries
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "binaries for ${GITHUB_SHA}"
          # The branch name carries where it came from, so a machine with only
          # git can ask for a specific build by name and get exactly it.
          # GITHUB_REF is refs/pull/N/merge on a pull_request event, which
          # sanitises into "binaries-refs-pull-64-merge-" - a name nobody can
          # guess and `update.cmd --fetch` cannot be told. GITHUB_HEAD_REF
          # carries the actual branch there and is empty everywhere else, so
          # prefer it and fall back to the ref name.
          SRC="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          if [ "${SRC}" = "main" ]; then
            TARGET=binaries
          else
            TARGET="binaries-$(echo "${SRC}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          fi
          echo "publishing as ${TARGET}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "binaries:${TARGET}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sweep binaries branches whose source is gone
        # Every branch build publishes binaries-<branch>, and merged branches
        # get deleted - so the binaries- copies linger forever unless something
        # sweeps them. Thirteen had accumulated in two days. Main's publish is
        # the natural broom: for each binaries-* ref, if the branch it was
        # built from no longer exists, delete it.
        if: github.ref == 'refs/heads/main'
        run: |
          git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||' > /tmp/heads
          grep '^binaries-' /tmp/heads | while read -r b; do
            src="${b#binaries-}"
            if ! grep -qxF "$src" /tmp/heads; then
              echo "sweeping $b (source $src is gone)"
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$b" || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
